<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Via CEP</title>
</head>
<body>
  <h1>Consultar endereço por CEP</h1>

  <label for="cep">Digite o CEP (8 dígitos)</label>
  <input type="text" id="cep" maxlength="9" placeholder="Ex: 01001010" />
  <button id="buscar">Buscar Endereço</button>

  <div id="resultado"></div>

  <script>
    const inputCep     = document.getElementById('cep');
    const btnBuscar    = document.getElementById('buscar');
    const divResultado = document.getElementById('resultado');

    // Dispara a busca quando o botão for clicado
    btnBuscar.addEventListener('click', consultarCEP);

    async function consultarCEP() {
      const cep = inputCep.value.trim();

      const url = `https://viacep.com.br/ws/${cep}/json/`;

      try {
        const resp = await fetch(url);
        if (!resp.ok) throw new Error('CEP não encontrado');

        const data = await resp.json();
        if (data.erro) {
          divResultado.textContent = 'CEP não encontrado.';
          return;
        }

        divResultado.innerHTML = `
          <h2>Endereço Encontrado:</h2>
          <ul>
            <li>CEP: ${data.cep}</li>
            <li>Logradouro: ${data.logradouro}</li>
            <li>Complemento: ${data.complemento}</li>
            <li>Bairro: ${data.bairro}</li>
            <li>Cidade: ${data.localidade}</li>
            <li>Estado: ${data.uf}</li>
          </ul>`;
      } catch (error) {
        divResultado.textContent = 'Erro ao consultar o CEP.';
        console.error(error);
      }
    }
  </script>
</body>
</html>
