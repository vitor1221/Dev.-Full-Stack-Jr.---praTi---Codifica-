<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu Hamburger</title>
  <style>
    body {
  margin: 0;
  font-family: sans-serif;
}

header {
  background-color: #2c3e50;
  color: white;
  padding: 20px;
  position: relative;
}

h1 {
  margin: 0;
}

.nav-menu ul {
  list-style: none;
  padding: 0;
  margin: 10px 0 0;
  display: flex;
  gap: 20px;
}

.nav-menu a {
  color: white;
  text-decoration: none;
  font-weight: bold;
}

/* Ícone hamburger */
.hamburger {
  display: none;
  font-size: 24px;
  background: none;
  border: none;
  color: white;
  position: absolute;
  top: 20px;
  right: 20px;
  cursor: pointer;
}

/* 💡 Responsivo: telas menores que 600px */
@media (max-width: 600px) {
  .nav-menu ul {
    display: none;
    flex-direction: column;
    background-color: #34495e;
    padding: 10px;
    border-radius: 8px;
  }

  .nav-menu.active ul {
    display: flex;
  }

  .hamburger {
    display: block;
  }
}
  </style>
</head>
<body>

  <header >
    <h1>Minha Página</h1>
    <nav class="nav-menu">
      <ul>
        <li><a href="#">Início</a></li>
        <li><a href="#">Sobre</a></li>
        <li><a href="#">Serviços</a></li>
        <li><a href="#">Contato</a></li>
      </ul>
    </nav>

    <!-- Ícone Hamburger -->
    <button class="hamburger" onclick="toggleMenu()">☰</button>
  </header>

  <script>
    function toggleMenu() {
      const nav = document.querySelector('.nav-menu');
      nav.classList.toggle('active');
    }
  </script>

</body>
</html>
